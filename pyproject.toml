[project]
name = "trbench"
version = "0.1.0"
description = "Turkish open-LLM serving & quality benchmark"
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "pyyaml", "httpx", "pandas", "pyarrow"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
tok = ["transformers>=4.45", "tokenizers", "huggingface_hub", "sentencepiece", "protobuf", "matplotlib"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trbench*"]

[tool.ruff]
line-length = 100
