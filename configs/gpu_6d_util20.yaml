# Faz 6d: Turkce TTFT artisi kuyruktan mi? Upstream vLLM 0.18.1 + GPTQ, KV alani kademeli (util 0.20).
# /metrics'ten bekleyen istek ve preemption; warm-up; 5 tekrar; p99. Sonuclar: results/gpu_6d.jsonl
#   bash scripts/night_6d.sh
engine: vllm
port: 18001
gpu_memory_utilization: 0.20
enforce_eager: true
extra_args: [--max-num-batched-tokens, "2048", --quantization, gptq]
max_model_len: 2048
max_tokens: 256
max_num_seqs: 8
concurrency: [4, 8]
langs: [tr, en]
repeats: 5
warmup: 4
min_requests: 24
queue_metrics: true
results: results/gpu_6d.jsonl
models:
  - {name: mistral-7b-v0.3, quant: gptq-int4, params_b: 7.2, repo: RedHatAI/Mistral-7B-Instruct-v0.3-GPTQ-4bit, weights_gb_actual: 4.2}
