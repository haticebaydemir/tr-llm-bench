# Faz 7a ek kosu: esit token (TR = EN = 300) + prefix cache KAPALI. 6d'nin "token sayisi, dil degil" sonucu
# cache acikken olculmustu; burada her tekrar gercek prefill. Sonuclar: results/gpu_6d_mnbt.jsonl
#   cd /disk3/trbench/yeni && nohup bash scripts/gpu_bench.sh configs/gpu_6d_mnbt_matched.yaml > /disk3/trbench/logs/mnbt_matched.out 2>&1 &
engine: vllm
port: 18001
gpu_memory_utilization: 0.20
enforce_eager: true
extra_args: [--max-num-batched-tokens, "2048", --quantization, gptq, --no-enable-prefix-caching]
max_model_len: 2048
max_tokens: 256
max_num_seqs: 8
concurrency: [4, 8]
langs: [tr, en]
repeats: 5
warmup: 4
min_requests: 24
queue_metrics: true
prompt_tokens: 300
results: results/gpu_6d_mnbt.jsonl
models:
  - {name: mistral-7b-v0.3, quant: gptq-int4, params_b: 7.2, repo: RedHatAI/Mistral-7B-Instruct-v0.3-GPTQ-4bit, weights_gb_actual: 4.2}
