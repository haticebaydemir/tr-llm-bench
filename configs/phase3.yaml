# Faz 3, 16 Kasim (tarihi): vLLM, GPU 2, 0.80 ayarinda ve CUDA graph ile.
# Bu ayar GPU 2 toplamini 29.6 GB'a cikardi ve servisin alarmi caldi; artik REDDEDILIR.
# Sonuclar results/phase3.jsonl'da korunuyor. Yeni GPU olcumleri: configs/gpu_*.yaml
engine: vllm
port: 18001
gpu_memory_utilization: 0.20
enforce_eager: true
max_model_len: 2048
max_tokens: 256
max_num_seqs: 16
concurrency: [1, 4, 8, 16]
langs: [tr, en]
repeats: 3
results: results/phase3.jsonl
models:
  - {name: qwen2.5-7b, quant: awq-int4, params_b: 7.6, repo: Qwen/Qwen2.5-7B-Instruct-AWQ, weights_gb_actual: 5.6}
